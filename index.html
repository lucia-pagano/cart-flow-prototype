<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add to cart flow - from search</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
<style>
@font-face{font-family:'Glovo Sans';font-weight:400;src:url(fonts/glovosans-book.otf)}
@font-face{font-family:'Glovo Sans';font-weight:500;src:url(fonts/glovosans-medium.otf)}
@font-face{font-family:'Glovo Sans';font-weight:600;src:url(fonts/glovosans-bold.otf)}
@font-face{font-family:'Glovo Sans';font-weight:700;src:url(fonts/glovosans-bold.otf)}
:root{--brand:#ffc042;--line:#e6e6e7;--green:#017963}
body{margin:0;background:#EAEDF3;font-family:'Glovo Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#161617;padding:24px}
#flow{position:relative;display:grid;grid-template-columns:repeat(4,296px);column-gap:110px;row-gap:110px;justify-content:center;padding:40px 40px 40px}
.scr{width:296px;height:700px;background:#fff;overflow:hidden;position:relative;display:flex;flex-direction:column}
.scr *{box-sizing:border-box}
.scr p{margin:0}
.scr button{font-family:inherit;color:inherit}
#svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
/**
 * nav-tokens.css — shared design tokens for the nav/zone component library.
 *
 * Source of truth: scenario-tool/nc-hu/scenario-tool-package/Homepage Vision.html
 * (its :root block — kept in sync manually, see nav-components.css for why).
 * Consumed by:
 *   - deck/Homepage-v3-Deck-v2.html
 *
 * --pv-w is the single definition of the phone's content viewport width (296px).
 * Anything that needs to match the scenario tool's device width should reference
 * var(--pv-w) instead of hardcoding 296.
 */
:root{
 --pv-w:296px;
 --awar-bg:#e1f5ee;--awar-fg:#017963;
 --habt-bg:#eeedfe;--habt-fg:#534ab7;
 --disc-bg:#e6f1fb;--disc-fg:#185fa5;
 --conv-bg:#ffe8bd;--conv-fg:#8a5a00;
 --actv-bg:#fdeadd;--actv-fg:#c14a08;
 --faml-bg:#fde8f0;--faml-fg:#b03a68;
 --spon-bg:#f5ead2;--spon-fg:#8a6a1f;
 /* product/item tile illustration size — edit here once */
 --prod-img-h:90px;--prod-img-icon:30px;
}
/**
 * nav-components.css — shared CSS for the nav/zone component library (doors, awareness
 * banners, store/product cards, brand tiles, feed cards, pick-up banner, section blocks).
 *
 * Source of truth: scenario-tool/nc-hu/scenario-tool-package/Homepage Vision.html
 * (its single <style> block, which both tabs already share — kept in sync manually here).
 *
 * Consumed by:
 *   - deck/Homepage-v3-Deck-v2.html
 *
 * NOT loaded by Homepage Vision.html itself: unlike the render JS (which was duplicated
 * once per tab and now loads nav-render.js instead), the tool's CSS lives in one inline
 * <style> block already shared by both tabs, so there is no internal duplication to fix.
 * When you change a rule below, mirror the change in vision.html's <style> block too —
 * the class names and property values must stay identical, or the deck will drift.
 *
 * Requires nav-tokens.css to be loaded first (for --pv-w and the mission color vars).
 * Requires nav-render.js for the matching render functions (catDoor, hva, pcard, etc).
 */

/* device content viewport (matches the scenario tool's .pv width) */
.pv{width:var(--pv-w)}
.tabslot{width:var(--pv-w)}
.pvx{width:var(--pv-w)}

/* zone section wrapper */
.zz{padding:0 12px;margin-bottom:16px}
.tt{font-size:14px;font-weight:600;color:#161617;margin:0}
.ss{font-size:12px;color:#626364;margin:2px 0 0}

/* horizontally-scrolling row of cards/doors */
.rowx{display:flex;gap:8px;align-items:flex-start;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.rowx::-webkit-scrollbar{height:5px}
.rowx::-webkit-scrollbar-thumb{background:#d5d6d7;border-radius:3px}

/* "G" glovo glyph badge, used inside awareness banners */
.gico{background:var(--brand,#ffc042);color:#161617;font-weight:800;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:inherit;flex:0 0 auto}

/* door — .eb is the canonical door/entry-point button */
.eb{flex:0 0 68px;width:68px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;border:none;background:none;padding:0;font-family:inherit;position:relative;cursor:pointer}
.eb .ic{width:68px;height:58px;flex:0 0 58px;border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.eb .nm{font-size:8.5px;font-weight:700;letter-spacing:.02em;color:#161617;margin-top:4px;display:block;width:100%;line-height:1.2;white-space:normal;overflow-wrap:break-word;word-break:break-word}
.eb.anchor .ic{box-shadow:inset 0 0 0 2px var(--acc,#f75808)}
.eb .tg{position:absolute;top:-5px;right:-2px;font-size:9px;font-weight:600;color:#fff;border-radius:6px;padding:1px 5px;white-space:nowrap;z-index:3}
.eb .xsell{position:absolute;bottom:0;left:0;right:0;height:3px;background:#6464e8}
.eb .bfoff{font-size:9px;font-weight:800;letter-spacing:.02em;margin-top:2px}

/* filter chip */
.fchip{flex:0 0 auto;border:1px solid var(--line,#e6e6e7);border-radius:999px;padding:6px 10px;font-size:12px;color:#161617;white-space:nowrap;background:#fff;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:4px;height:32px}
button.fchip{cursor:pointer}
.fchip.kw{border-style:dashed;border-color:#b9baf4}
.fchip.earn{border-style:dashed;border-color:#8fcab3;color:#017963}
.fchip.sel{background:#161617;color:#fff;border-color:#161617}
.fchip.off{color:#b6b7b8;border-color:#f0f0ef;text-decoration:line-through}

/* awareness banner — one slot, several dimensions competing for it */
.hva{border:1.5px solid #6464e8;border-radius:20px;display:flex;overflow:hidden;height:138px;background:#fff;padding:0;width:100%;font-family:inherit;text-align:left}
.hva.pw{border:none;background:linear-gradient(135deg,#6a5cf0,#3d2fb0)}
.hva-rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.hva-rail .hva{flex:0 0 85%;scroll-snap-align:start}
.hva-rail.one .hva{flex:0 0 100%}
.hva-rail .pwpromo{flex:0 0 85%;scroll-snap-align:start}
.hva-rail.one .pwpromo{flex:0 0 100%}
.pwpromo{border:none;background:none;padding:0;font-family:inherit;text-align:left;cursor:pointer;width:100%}
.pwpromo-img{position:relative;height:132px;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(45deg,#6a5cf0,#6a5cf0 14px,#3d2fb0 14px,#3d2fb0 28px);display:flex;align-items:center;justify-content:center}
.pwpromo-img i.bgicon{position:absolute;font-size:120px;color:rgba(255,255,255,.14);transform:rotate(-12deg)}
.pwpromo-tag{position:absolute;top:8px;left:8px;z-index:2;display:inline-flex;align-items:center;gap:4px;background:#fff;color:#3d2fb0;font-size:10px;font-weight:800;letter-spacing:.02em;border-radius:999px;padding:3px 9px 3px 7px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pwpromo-hrt{position:absolute;top:8px;right:8px;z-index:2;width:26px;height:26px;border-radius:50%;background:rgba(22,22,23,.32);display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:5px;justify-content:center;margin-top:8px}
.dots span{width:5px;height:5px;border-radius:50%;background:#e6e6e7;display:block}
.dots span.on{background:#161617}

/* pick-up entry point (saturation only) */
.mapb{display:flex;align-items:stretch;border:1.5px solid #185fa5;border-radius:20px;overflow:hidden;background:#fff;height:92px;margin:10px 12px 16px}
.mapimg{flex:0 0 92px;position:relative;background:linear-gradient(#e9efe3,#dfe9ef)}
.mapimg .grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff88 1px,transparent 1px),linear-gradient(90deg,#ffffff88 1px,transparent 1px);background-size:20px 20px}
.mapimg .me{position:absolute;left:44%;top:46%;width:10px;height:10px;border-radius:50%;background:#185fa5;border:2.5px solid #fff}
.maptx{flex:1;min-width:0;padding:10px 10px 10px 11px;display:flex;flex-direction:column;justify-content:center}
.maptx .mlab{display:inline-block;font-size:8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 5px;background:#e8edf8;color:#185fa5;align-self:flex-start}
.maptx b{font-size:13px;font-weight:600;line-height:1.25;margin-top:4px}
.maptx span.ms{font-size:11.5px;color:#626364;margin-top:2px}
.mchev{flex:0 0 34px;display:flex;align-items:center;justify-content:center}

/* section block chrome (gray card / arrow-to-see-more) */
.gray{background:#f7f7f6;border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.arrow{width:28px;height:28px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 28px}

/* usual/store card */
.stl{width:130px;flex:0 0 130px}
.stl .im{height:76px;border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative}
.hrt{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.mt{display:inline-flex;align-items:center;gap:3px;background:#f2f2f3;border-radius:6px;padding:1px 5px;font-size:10px;color:#626364;margin-top:4px;margin-right:3px}
.mt.busy{background:#fdeadd;color:#c14a08}

/* product card */
.pcard{flex:0 0 112px}
.pcard .pim{height:var(--prod-img-h);border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 0 1px #f0f0ef}
.pcard .pim i{font-size:var(--prod-img-icon)}
.strike{color:#838486;text-decoration:line-through;font-weight:400;font-size:11px;margin-left:4px}

/* brand tile */
.tile{width:66px;height:66px;flex:0 0 66px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;text-align:center;line-height:1.1;position:relative;overflow:hidden}
.tile .bdg{position:absolute;top:4px;left:4px;font-size:10px;font-weight:600;border-radius:6px;padding:0 4px}
.tw{width:66px;flex:0 0 66px}
.ff{font-size:11px;color:#161617;margin-top:4px;text-align:center}

/* mission/category vertical tag, used on feed rows and cards */
.vcat{display:inline-block;font-size:9.5px;font-weight:600;border-radius:5px;padding:1px 5px;margin-right:5px;vertical-align:1.5px}

/* saturation ops strip + Prime pill */
.opsstrip{background:#fff;border-radius:14px;margin-top:8px;padding:9px 10px;display:flex;gap:8px;align-items:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pmpill{display:inline-flex;align-items:center;gap:3px;background:#eeedfe;color:#534ab7;border-radius:5px;padding:1px 5px;font-size:9.5px;font-weight:600;margin-left:5px}

/* feed / filtered-results list row */
.lrow{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #f2f2f3;align-items:center}
.lrow .th{width:60px;height:60px;border-radius:12px;flex:0 0 60px;display:flex;align-items:center;justify-content:center}
.rstc{border:1px solid #161617;background:#fff;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;flex:0 0 auto}

.sb{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 4px;font-size:12px;font-weight:600;position:absolute;left:0;right:0;top:0;z-index:3}
.sb .ico{display:flex;gap:4px;font-size:12px}
.circ{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;border:none;box-shadow:0 1px 4px rgba(0,0,0,.12);flex:0 0 auto}
.circ i{font-size:17px}
/* 1 · search */
.sh{display:flex;gap:8px;align-items:center;padding:16px 12px 8px}
.sp{flex:1;background:#f2f2f3;border-radius:999px;padding:9px 12px;font-size:13px;display:flex;align-items:center;gap:8px}
.sp i{font-size:15px;color:#626364}
.cartc{position:relative;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px #e6e6e7;display:flex;align-items:center;justify-content:center}
.cartc b{position:absolute;top:-3px;right:-3px;min-width:15px;height:15px;border-radius:999px;background:#ea5a1f;color:#fff;font-size:9px;line-height:15px;text-align:center;padding:0 3px}
.vt{display:flex;gap:16px;padding:0 12px;border-bottom:1px solid #e6e6e7;overflow:hidden}
.vt span{font-size:12px;color:#626364;padding:8px 0;white-space:nowrap}
.vt span.on{color:#161617;font-weight:700;box-shadow:inset 0 -2px 0 #161617}
.chips{display:flex;gap:6px;padding:12px;overflow:hidden}
.ch{flex:0 0 auto;background:#f2f2f3;border-radius:999px;padding:7px 11px;font-size:12px;display:inline-flex;gap:4px;align-items:center}
.res{font-size:11px;padding:0 12px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding:0 12px}
.pt .im{height:112px;border-radius:14px;background:#f2f2f3;position:relative;display:flex;align-items:center;justify-content:center}
.pt .im>i.pi{font-size:34px}
.pt .bd{position:absolute;top:6px;left:6px;background:#e5173f;color:#fff;font-size:10px;font-weight:600;border-radius:5px;padding:1px 5px}
.pt .ad{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;border:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;padding:0}
.pt .ad i{font-size:14px}
.pt .sp2{font-size:10px;color:#185fa5;margin-top:5px}
.pt .nm{font-size:12.5px;font-weight:600;margin-top:4px}
.pt .pr{font-size:11.5px;color:#626364;margin-top:1px}
.sw{display:flex;gap:3px;margin-top:5px;align-items:center}
.sw i{width:16px;height:16px;border-radius:4px;display:block}
.sw span{font-size:9px;background:#f2f2f3;border-radius:5px;padding:1px 4px}
/* 2/4 · product page */
.hero{height:290px;background:#f2f2f3;position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.hero>i.big{font-size:90px}
.hero .x{position:absolute;top:44px;left:14px}
.hero .ex{position:absolute;right:14px;bottom:14px}
.dots2{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#fff;border-radius:999px;padding:5px 7px}
.dots2 span{width:6px;height:6px;border-radius:50%;background:#d5d6d7}.dots2 span.on{background:#161617}
.pb{padding:14px 16px;flex:1;min-height:0;overflow:hidden}
.tg{display:inline-block;font-size:10px;font-weight:600;border-radius:5px;padding:2px 6px;background:#e1f5ee;color:#017963}
.pb h2{font-size:21px;line-height:26px;font-weight:700;margin:6px 0 2px}
.pb .d{font-size:12px;color:#838486}
.pb .rt{font-size:12px;margin-top:6px}
.pb h3{font-size:17px;font-weight:700;margin:16px 0 8px}
.sel{border:1.5px solid #161617;border-radius:12px;padding:10px;margin-bottom:8px;position:relative}
.sel.o{border-color:#e6e6e7}
.sel .lg{width:30px;height:30px;border-radius:8px;background:#f2f2f3;position:absolute;left:10px;top:12px;display:flex;align-items:center;justify-content:center}
.sel .in{margin-left:40px}
.sel .t{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.sel .bc{font-size:9.5px;background:#017963;color:#fff;border-radius:5px;padding:2px 6px;font-weight:600}
.sel .m{font-size:11.5px;color:#626364;margin-top:3px;display:flex;justify-content:space-between}
.sel .m b{color:#161617;font-size:14px}
.prime{font-size:11px;font-weight:700;color:#534ab7;margin-top:2px}
.prime s{font-weight:400}
.abar{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:10px 12px 22px;display:flex;gap:8px;align-items:center;box-shadow:0 -6px 14px rgba(0,0,0,.06)}
.abar .qs{display:inline-flex;align-items:center;gap:12px;background:#f2f2f3;border-radius:999px;padding:11px 14px;font-size:14px;font-weight:600}
.abar .qs i{font-size:15px}
.abar .gb{flex:1;background:#017963;color:#fff;border:none;border-radius:999px;font-size:13.5px;font-weight:700;padding:13px 0}
.abar .home{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:100px;height:4px;border-radius:2px;background:#161617}
/* 3 · added sheet */
.dim{background:#8a8a8b;flex:0 0 250px;position:relative}
.sheet{flex:1;background:#fff;border-radius:22px 22px 0 0;margin-top:-18px;padding:14px 14px 18px;position:relative;display:flex;flex-direction:column}
.added{display:flex;align-items:center;gap:10px}
.added .th{width:34px;height:34px;border-radius:8px;background:#f2f2f3;display:flex;align-items:center;justify-content:center}
.added .tx{flex:1;min-width:0}
.added b{font-size:12.5px;font-weight:600;display:block}
.added span{font-size:11px;color:#626364;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.added .cl{font-size:18px;font-weight:700;border:none;background:none;padding:4px 6px}
.sheet h4{font-size:15px;font-weight:700;margin:16px 0 10px}
.dr{display:flex;gap:8px}
.dr .c{flex:1;min-width:0}
.dr .im{height:76px;border-radius:12px;background:#f2f2f3;position:relative;display:flex;align-items:center;justify-content:center}
.dr .im i.pi{font-size:26px}
.dr .ad{position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:50%;background:#fff;border:none;box-shadow:0 1px 3px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;padding:0}
.dr .ad i{font-size:12px}
.dr .n{font-size:11.5px;font-weight:600;margin-top:5px}
.dr .p{font-size:11px;color:#626364}
.btn{display:block;width:100%;border:none;border-radius:999px;font-size:13.5px;font-weight:700;padding:13px 0;text-align:center;margin-top:10px}
.btn.g{background:#f2f2f3;color:#161617}.btn.c{background:#017963;color:#fff}
/* 5 · cart */
.ph{display:flex;align-items:center;gap:8px;padding:22px 16px 4px}
.ph h1{font-size:22px;line-height:26px;font-weight:700;margin:0}
.ph i{font-size:20px}
.sec{font-size:13px;color:#626364;padding:14px 16px 6px}
.sec b{color:#161617;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:8px 16px}
.row .im{width:56px;height:56px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px #e6e6e7;display:flex;align-items:center;justify-content:center;flex:0 0 56px;position:relative}
.row .im i.pi{font-size:24px}
.row .tx{flex:1;min-width:0}
.row .nm{font-size:13px;line-height:17px}
.row .pr{font-size:13px;font-weight:600;margin-top:2px}
.step{display:inline-flex;align-items:center;gap:10px;background:#f2f2f3;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.step i{font-size:13px}
.chk{position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:6px;border:1.5px solid #161617;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.chk i{font-size:13px;color:#fff;display:none}
.chk.on{background:#017963;border-color:#017963}.chk.on i{display:block}
.bar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e6e6e7;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -4px 12px rgba(0,0,0,.05)}
.bar .t1{font-size:12px;color:#626364}.bar .t2{font-size:15px;font-weight:700}
.bar button{background:#017963;color:#fff;border:none;border-radius:999px;font-size:13px;font-weight:700;padding:11px 18px}
/* 6 · store */
.shero{height:150px;background:#f2f2f3;position:relative;flex:0 0 auto;display:flex;align-items:flex-end;padding:0 16px 16px}
.shero .bk{position:absolute;top:44px;left:14px}
.shero h1{font-size:26px;font-weight:700;margin:0}
.ssr{margin:12px 12px 0;border:1.5px solid #e6e6e7;border-radius:999px;padding:10px 14px;font-size:13px;color:#626364;display:flex;gap:8px;align-items:center}
.sl{font-size:14px;font-weight:700;padding:16px 16px 8px}
.pr3{display:flex;gap:8px;padding:0 16px}
.pr3 .c{flex:1;min-width:0}
.pr3 .im{height:84px;border-radius:12px;background:#f2f2f3;position:relative;display:flex;align-items:center;justify-content:center}
.pr3 .im i.pi{font-size:28px}
.pr3 .mini{position:absolute;right:5px;bottom:5px;background:#fff;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.pr3 .n{font-size:11.5px;margin-top:4px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}

<body>
<div id="side">
 <div id="mseg"><button data-m="search" class="on">Search flow</button><button data-m="home">Home flow</button></div>
 <div id="seg"><button data-v="food" class="on">Food</button><button data-v="groceries">Groceries</button><button data-v="retail">Retail</button></div>
 <div class="sopt"><label><input type="checkbox" id="hot"> Tap targets</label><button id="restart">Restart</button></div>
 <div id="ep"></div>
</div>
<div class="device"><div id="stage"></div></div>
<script>window.HV=(function(){
var S={prime:false,sat:false,bf:false,lcd:false};
/* ================= builders ================= */
function gico(sz,fs){return '<span class="gico" style="width:'+sz+'px;height:'+sz+'px;font-size:'+fs+'px">G</span>';}
var doorBg=['#fde8dd','#e1f5ee','#e6f1fb','#fdeadd','#eaf3de','#fbeaf0'];
function doorBtn(i){
 return '<button class="eb'+(i===1?' anchor':'')+'"><span class="ic" style="background:'+doorBg[i-1]+'">'+gico(26,13)+'</span><span class="nm">DOOR '+i+'</span></button>';
}
/* event door &mdash; the offer lives inside the illustration, not on a tag */
function bfDoor(){
 return '<button class="eb"><span class="ic" style="background:var(--actv-bg);flex-direction:column"><i class="ti ti-tag" style="font-size:22px;color:var(--actv-fg)"></i><span class="bfoff">&minus;40%</span></span><span class="nm">BLACK FRIDAY</span></button>';
}
/* named category doors &mdash; italian & convenience open a wall (clickable); the rest are inert.
   fs = per-glyph optical size: tall/narrow glyphs are bumped so every icon fills the same footprint */
/* every door belongs to one of three sources, and its fill color says which &mdash; fixed = same
   catalog every time &middot; personalized = ranked/shown for this customer &middot; dynamic = this slot
   itself changes for a live campaign (Match night &rarr; Black Friday, Prime Week) */
var DOORSRC={fixed:['var(--awar-bg)','var(--awar-fg)'],personalized:['var(--habt-bg)','var(--habt-fg)'],dynamic:['var(--actv-bg)','var(--actv-fg)']};
var DOORCAT=[
 {k:'conv',n:'Convenience',i:'ti-basket',wall:true,fs:24,src:'fixed'},
 {k:'italian',n:'Italian',i:'ti-pizza',wall:true,fs:24,src:'personalized'},
 {k:'flowers',n:'Flowers',i:'ti-flower',fs:25,src:'fixed'},
 {k:'oriental',n:'Oriental',i:'ti-bowl',fs:24,src:'personalized'},
 {k:'gmarket',n:'Glovo Market',i:'ti-building-store',fs:24,src:'fixed'},
 {k:'electronics',n:'Electronics',i:'ti-device-mobile',fs:27,src:'fixed'},
 {k:'health',n:'Health',i:'ti-first-aid-kit',fs:23,src:'fixed'},
 {k:'match',n:'Match night',i:'ti-ball-football',fs:24,src:'dynamic'},
 {k:'tabacco',n:'Tabacco',i:'ti-flame',fs:25,src:'fixed'},
 {k:'package',n:'Package delivery',i:'ti-package',fs:24,src:'fixed'}
];
var PRIMEDOOR={k:'primew',n:'Prime Week',i:'ti-crown',fs:24,src:'dynamic'};
function catDoor(d){
 var col=DOORSRC[d.src]||[d.bg,d.fg];
 return '<button class="eb"'+(d.wall?' data-door="'+d.k+'"':'')+'><span class="ic" style="background:'+col[0]+'"><i class="ti '+d.i+'" style="font-size:'+(d.fs||24)+'px;color:'+col[1]+'"></i></span><span class="nm">'+d.n.toUpperCase()+'</span></button>';
}
/* the "Browse more" tile: visually distinct from the pastel content-vertical doors &mdash; a dark
   ink icon circle (same convention as the app's .cta buttons) instead of a tinted one, so it
   reads as a utility action rather than another category. */
function browseMoreDoor(){
 return '<button class="eb" data-browsemore="1"><span class="ic" style="background:#161617"><i class="ti ti-grid-dots" style="font-size:24px;color:#fff"></i></span><span class="nm">BROWSE MORE</span></button>';
}
/* build a door row for a panel: same catalog for both; Black Friday takes the Match slot; HU gains the Prime Week door under Prime */
function doorRow(isHU){
 var out='';
 if(S.bf)out+=bfDoor();
 DOORCAT.forEach(function(d){if(S.bf&&d.k==='match')return;if(S.bf&&d.k==='electronics'){out+=catDoor({k:'iphone',n:'iPhone',i:'ti-device-mobile',fs:27,src:'dynamic'});return;}out+=catDoor(d);});
 if(isHU&&S.prime)out+=catDoor(PRIMEDOOR);
 out+=browseMoreDoor();
 return '<div class="zz" data-x="doors"><div class="rowx" style="padding-top:6px">'+out+'</div></div>';
}
function scBtn(s){
 return '<button class="eb">'+(s.tag?'<span class="tg" style="background:'+s.tagBg+'">'+s.tag+'</span>':'')+'<span class="ic" style="background:'+s.bg+(s.ring?';box-shadow:inset 0 0 0 2px '+s.ring:'')+'"><i class="ti '+s.i+'" style="font-size:23px;color:'+s.fg+'"></i><span class="xsell"></span></span><span class="nm">'+s.n+'</span></button>';
}
function chip(c){
 var cls=c[1]?' '+c[1]:'';
 var ic=c[2]?'<i class="ti '+c[2]+'" style="font-size:12px"></i> ':'';
 if(c[3])return '<button class="fchip'+cls+'" data-chip="'+c[3]+'">'+ic+c[0]+'</button>';
 return '<span class="fchip'+cls+'">'+ic+c[0]+'</span>';
}
function hva(k,kbg,kc,t,s2,blob,bc){
 return '<span class="hva" style="border-color:'+(bc||kc)+'"><span style="flex:1.4;padding:16px;display:block"><span style="display:inline-block;font-size:8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 5px;background:'+kbg+';color:'+kc+'">'+k+'</span><span style="font-size:13.5px;font-weight:600;line-height:1.25;display:block;color:#161617;margin-top:8px">'+t+'</span><span style="font-size:11.5px;color:#626364;margin-top:8px;display:block;line-height:1.3">'+s2+'</span></span><span style="flex:.7;background:'+blob+';display:flex;align-items:center;justify-content:center;position:relative">'+gico(30,15)+'<span style="position:absolute;bottom:7px;right:7px;width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center"><i class="ti ti-chevron-right" style="font-size:13px"></i></span></span></span>';
}
function actv(t,s2,blob){return hva('Activation','#fdeadd','#c14a08',t,s2,blob,'#f75808');}
function spon(t,s2){return hva('Sponsored','#f5ead2','#8a6a1f',t,s2,'#ffe8bd','#b8860b');}
function evc(t,s2){return hva('Black Friday','#fdeadd','#c14a08',t,s2,'#fdeadd','#c14a08');}
/* Prime Week gets its own full-bleed card instead of the shared white hva shell &mdash; it needs to
   read as a different kind of thing at a glance, not just another banner in the same rail. */
function pwPromo(o){
 return '<div class="pwpromo"><div class="pwpromo-img"><i class="ti ti-crown-filled bgicon"></i>'+
  '<span class="pwpromo-tag"><i class="ti ti-bolt" style="font-size:11px"></i> PRIME WEEK &minus;'+o.off+'%</span>'+
  '<span class="pwpromo-hrt"><i class="ti ti-heart" style="font-size:13px;color:#fff"></i></span></div>'+
  '<div style="padding:9px 2px 0"><div style="font-size:13px;font-weight:600">'+o.name+'</div>'+
  '<div style="font-size:11.5px;color:#626364;margin-top:2px"><i class="ti ti-thumb-up" style="font-size:11px;color:#009e81"></i> '+o.rating+' &middot; '+o.eta+' &middot; '+o.fee+'</div></div></div>';
}
function pwc(t,s2){
 return '<span class="hva pw"><span style="flex:1;padding:12px 40px 12px 14px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2">'+
  '<span style="display:inline-flex;align-items:center;gap:4px;width:fit-content;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:rgba(255,255,255,.22);color:#fff"><i class="ti ti-crown" style="font-size:11px"></i> Prime Week</span>'+
  '<span style="font-size:14px;font-weight:700;line-height:1.25;display:block;color:#fff;margin-top:5px">'+t+'</span>'+
  '<span style="font-size:11.5px;color:rgba(255,255,255,.8);margin-top:3px;display:block;line-height:1.3">'+s2+'</span>'+
  '</span>'+
  '<span style="position:absolute;top:50%;right:14px;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;z-index:2"><i class="ti ti-chevron-right" style="font-size:13px;color:#fff"></i></span>'+
  '</span>';
}
function rail(cards){
 return '<div class="zz" data-x="rail"><div class="hva-rail'+(cards.length===1?' one':'')+'">'+cards.join('')+'</div></div>';
}
/* new component &middot; pick-up entry point (saturation only) &mdash; collect it yourself, skip the courier queue */
function mapBanner(n){
 var pins=[[20,26],[58,18],[38,56],[70,62]];
 var h='<div class="mapb" data-x="mapb"><div class="mapimg"><span class="grid"></span>';
 pins.forEach(function(p){h+='<i class="ti ti-map-pin" style="position:absolute;left:'+p[0]+'%;top:'+p[1]+'%;font-size:14px;color:#f75808"></i>';});
 h+='<span class="me"></span></div>';
 h+='<div class="maptx"><span class="mlab">Pick up</span><b>Skip the wait &mdash; pick it up</b><span class="ms">'+n+' stores ready to collect near you</span></div>';
 h+='<span class="mchev"><i class="ti ti-chevron-right" style="font-size:15px;color:#185fa5"></i></span>';
 return h+'</div>';
}
function block(key,title,sub,inner,style){
 var open='<div class="zz" data-filterable="1"'+(key?' data-x="'+key+'"':'')+'>';
 var purple=style==='purple';
 var titleStyle=purple?' style="color:#534ab7"':'';
 var arrowBg=style==='white'?' style="background:#f2f2f3"':(purple?' style="background:#fff"':'');
 var arrowIcon=purple?' style="font-size:14px;color:#534ab7"':' style="font-size:14px"';
 var head='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:'+(style==='white'?'10':'8')+'px"><div><p class="tt"'+titleStyle+'>'+title+'</p>'+(sub?'<p class="ss">'+sub+'</p>':'')+'</div><span class="arrow"'+arrowBg+'><i class="ti ti-arrow-right"'+arrowIcon+'></i></span></div>';
 if(style==='white')return open+'<div class="gray" style="background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.07);border-radius:20px">'+head+'<div class="rowx">'+inner+'</div></div></div>';
 if(style==='plain')return open+head+'<div class="rowx">'+inner+'</div></div>';
 if(purple)return open+'<div class="gray" style="background:#eeedfe;padding:9px 9px 0">'+head+'<div class="rowx">'+inner+'</div></div></div>';
 if(style==='bf')return open+'<div class="gray" style="background:#fdeadd">'+head+'<div class="rowx">'+inner+'</div></div></div>';
 return open+'<div class="gray">'+head+'<div class="rowx">'+inner+'</div></div></div>';
}
/* a card is promo-eligible if it carries a real discount badge (rank badges use badgeBg #161617,
   free-delivery is not a promo). data-ct lists the operational filters the card satisfies, so the
   Promos / Schedule chips can keep only the matching cards and drop the rest in place. */
function isPromoBadge(b,bg){return !!b && bg!=='#161617' && String(b).charAt(0)!=='#' && b!=='Free';}
function ctAttr(promo,o){
 var t=[];
 if(promo)t.push('promo');
 if(o&&o.sched)t.push('sched');
 /* a store that's schedule-only isn't open for an immediate order right now &mdash; everything else is */
 if(!(o&&o.sched))t.push('open');
 if(o&&o.pickup)t.push('pickup');
 /* the Pizza chip filters down to this &mdash; same mechanism as every other operational chip */
 if(o&&o.pizza)t.push('pizza');
 if(o&&o.poke)t.push('poke');
 if(o&&o.salad)t.push('salad');
 if(o&&o.iphone)t.push('iphone');
 /* Glovo's store score runs 0&ndash;100%; 96%+ is the "top rated" cut */
 if(o&&o.rating){var rm=/(\d+)/.exec(o.rating);if(rm&&+rm[1]>=96)t.push('top');}
 return ' data-card="1" data-ct="'+t.join(' ')+'"';
}
function pcard(o){

 var p=P[pid],c=cartOf(v.s);
 if(!c){c={s:v.s,items:[]};S.carts.push(c);}
 var f=c.items.filter(function(i){return i.pid===pid;})[0];
 if(f)f.q+=qty;else{var x=it(p.n,p.i,p.c,v.price,v.strike);x.pid=pid;x.q=qty;c.items.push(x);}
 selectOnly(v.s);
}

  '<h4>Delivery options '+ic('ti-info-circle',12,'#838486')+'</h4><div class="qkdo"><div class="hh" data-act="ckdo"><span>'+dl[0]+'<small>'+dl[1]+'</small></span>'+ic(scr.dopen?'ti-chevron-up':'ti-chevron-down',15)+'</div>'+
  (scr.dopen?opt('std','Standard','<span>20-30 min</span>')+opt('prio','Priority','<span>15-25 min</span>','+1,00€')+opt('sch','Schedule','<span>Select time</span>'):'')+'</div>'+
  '<h4>Payment method</h4><div class="qkl" style="padding-top:0"><span style="width:20px;height:14px;border-radius:3px;background:#161617;position:relative;display:inline-block;flex:0 0 20px"><i style="position:absolute;left:3px;top:2px;width:10px;height:10px;border-radius:50%;background:#ea2929"></i><i style="position:absolute;left:8px;top:2px;width:10px;height:10px;border-radius:50%;background:#f7a41c;opacity:.9"></i></span><span class="tx">Name<small>Card ending in 3245</small></span><i class="ti ti-edit" style="font-size:16px"></i></div>'+
  '<div class="qkl">'+ic('ti-discount-2','','').replace('class="ti ','class="ti l ')+'<span class="tx">Got a promo code?</span>'+ic('ti-chevron-right',16)+'</div>'+
  '<h4>Courier tip<small>The courier will get the full amount</small></h4><div class="qktip">'+tips+'</div>'+
  '<div class="qkck" data-act="cks"><span class="qkcb on"><i class="ti ti-check"></i></span>Save tip for next order</div>'+
  '<div class="qksum"><h4>Summary</h4><div class="r"><span>Products</span><span>'+money(orig)+'</span></div><div class="r"><span>Promotions</span><span>'+(orig>cur?'-'+money(orig-cur):money(0))+'</span></div><div class="r b"><span>Subtotal</span><span>'+money(cur)+'</span></div><hr>'+
  '<div class="r"><span>Delivery</span><span>'+money(fees+prio)+'</span></div><div class="r"><span>Services '+ic('ti-info-circle',11,'#838486')+'</span><span>'+money(serv)+'</span></div>'+
  (tip?'<div class="r"><span>Courier tip</span><span>'+money(tip)+'</span></div>':'')+
  (cur<10?'<div class="qkwarn">'+ic('ti-alert-triangle',13)+'Reach 10,00€ to avoid small order fee</div>':'')+
  '<hr><div class="qktot"><span>Total to pay</span><span>'+money(total)+'</span></div>'+
  '<div class="qkpr">'+ic('ti-discount-check',13,'#017963')+' You&rsquo;re saving <b>'+money(saving)+'</b> on this order.<div class="in"><span class="qkcb'+(scr.prime?' on':'')+'" data-act="ckp" data-hot="1"><i class="ti ti-check"></i></span><b class="p">PRIME</b><br><b style="font-weight:600">Save extra 3,29€ with Prime</b><br><span style="color:#626364;font-size:10.5px">One month for free, then 7,99€/month. Cancel anytime</span><u>Learn more</u></div></div>'+
  '<div class="qkleg">Couriers earn between 4€ and 5€ on average for each order they deliver, plus tips.<br><br>Contactless delivery: when possible, couriers will leave the order in front of your door. Please select credit card for this option.</div></div></div></div>'+
  '<div class="qkpay"><button data-act="ckpay" data-hot="1">Pay to order</button></div></div>';
}

/* ---------- navigation ---------- */
var RENDER={res:resHTML,pdp:pdpHTML,store:storeHTML,cart:cartHTML,chk:chkHTML,home:homeHTML,orders:ordersHTML};
function rerender(scr){var w=$('.w',scr.el),sc=$('.qsc',w),y=sc?sc.scrollTop:0;
 w.innerHTML=RENDER[scr.type](scr);
 var n=$('.qsc',w);if(n)n.scrollTop=y;}
function top(){return S.stack[S.stack.length-1];}
function push(type,o,base){
 var scr={type:type};for(var k in o)scr[k]=o[k];
 var el=document.createElement('div');el.className='scr'+(base?' base':'');el.style.zIndex=base?1:10+S.stack.length;
 if(!base)el.style.transform='translateX(100%)';
 el.innerHTML='<div class="w"></div>';scr.el=el;st.appendChild(el);S.stack.push(scr);rerender(scr);
 if(!base)requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.transform='none';});});
 return scr;
}
function pop(){if(S.stack.length<=1)return;var scr=S.stack.pop();scr.el.style.transform='translateX(100%)';setTimeout(function(){scr.el.remove();},420);rerender(top());}
function toast(scr,msg,bottom){
 var old=$('.qtoast',scr.el);if(old)old.remove();clearTimeout(scr.tt);
 var t=document.createElement('div');t.className='qtoast';t.style.bottom=bottom+'px';
 t.innerHTML='<i class="ti ti-circle-check" style="font-size:18px"></i><span>'+msg+'</span><i class="ti ti-x x" data-act="tx"></i>';
 $('.w',scr.el).appendChild(t);
 scr.tt=setTimeout(function(){t.remove();},3600);
}
function epText(){
 var vt=VERT[S.v];
 if(S.mode==='home')return '<b>Entry points to the cart</b><ol><li>Cart icon in the Home header</li><li>Orders tab &rarr; Open carts &rarr; View cart</li><li>Search tab (or a door) &rarr; add to cart &rarr; Go to cart</li></ol><p>From a cart entry point every cart is selected; untick what you do not want. The moment you add something, only that store&rsquo;s cart stays selected.</p>';
 return '<b>Entry points to the PDP</b><ol>'+vt.ep.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol><p>'+vt.note+'</p><p>Cart icon in the header opens the cart with everything selected; adding an item leaves only its store selected.</p>';
}
function goBase(t){st.innerHTML='';S.stack=[];push(t,{},true);}
function setV(v){S.v=v;document.querySelectorAll('#seg button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-v')===v);});$('#ep').innerHTML=epText();}
function reset(){
 st.innerHTML='';S.stack=[];seed();push(S.mode==='home'?'home':'res',{},true);
 $('#ep').innerHTML=epText();
}

/* ---------- actions ---------- */
st.addEventListener('click',function(e){
 var hx=e.target.closest('[data-x="cart"]');
 if(hx){var hs=S.stack.filter(function(x){return x.el===hx.closest('.scr');})[0];if(hs&&hs===top()){selectAll();push('cart',{});}return;}
 var dr=e.target.closest('[data-door]');
 if(dr&&S.mode==='home'&&top().type==='home'){var m={conv:'groceries',italian:'food'}[dr.getAttribute('data-door')];if(m){setV(m);goBase('res');}return;}
 var t=e.target.closest('[data-act]');if(!t)return;
 var el=t.closest('.scr'),scr=S.stack.filter(function(s){return s.el===el;})[0];if(!scr||scr!==top())return;
 var a=t.getAttribute('data-act'),d=t.dataset;
 if(a==='back'){pop();return;}
 if(a==='tx'){var q=$('.qtoast',scr.el);if(q)q.remove();return;}
 if(a==='cart'){selectAll();push('cart',{});return;}
 if(a==='tab'){if(S.mode==='home'&&d.t!=='profile')goBase(d.t==='search'?'res':d.t);return;}
 if(a==='door'){setV(d.v);goBase('res');return;}
 if(a==='store'){push('store',{store:d.store});return;}
 if(a==='pdp'){var p=P[d.pid],vi=0;
  if(d.store){p.vs.forEach(function(v,i){if(v.s===d.store)vi=i;});}
  push('pdp',{pid:d.pid,vi:vi,qty:1,added:false,more:vi>1,col:0,cz:0});return;}
 if(a==='quick'){e.stopPropagation();var pp=P[d.pid],vv=pp.vs.filter(function(v){return v.s===d.store;})[0];
  addToCart(d.pid,vv,1);rerender(scr);toast(scr,'Added to your cart',84);return;}
 if(scr.type==='pdp'){
  if(a==='vend'){if(!scr.added){scr.vi=+d.i;rerender(scr);}return;}
  if(a==='more'){scr.more=true;rerender(scr);return;}
  if(a==='col'){scr.col=+d.i;rerender(scr);return;}
  if(a==='cz'){scr.cz=+d.i;rerender(scr);return;}
  if(a==='qd'){var dd=+d.d,v2=P[scr.pid].vs[scr.vi];
   if(scr.added){var c=cartOf(v2.s),f=c.items.filter(function(i){return i.pid===scr.pid;})[0];if(f&&f.q+dd>=1)f.q+=dd;}
   else if(scr.qty+dd>=1)scr.qty+=dd;
   rerender(scr);return;}
  if(a==='pbtn')a=scr.added?'gocart':'add';
  if(a==='add'){var v3=P[scr.pid].vs[scr.vi];addToCart(scr.pid,v3,scr.qty);scr.added=true;scr.anim=true;rerender(scr);
   requestAnimationFrame(function(){requestAnimationFrame(function(){scr.anim=false;var ab=$('.abar',scr.el);if(ab)ab.classList.add('isadd');});});
   toast(scr,'Added to your cart',128);return;}
  if(a==='gocart'){push('cart',{});return;}
 }
 if(scr.type==='store'&&a==='gocart'){push('cart',{});return;}
 if(scr.type==='chk'){
  if(a==='cko'){scr.open[d.s]=!scr.open[d.s];rerender(scr);return;}
  if(a==='ckd'){scr.del=d.o;rerender(scr);return;}
  if(a==='ckdo'){scr.dopen=!scr.dopen;rerender(scr);return;}
  if(a==='ckt'){scr.tip=+d.t;rerender(scr);return;}
  if(a==='ckc'){scr.cut=!scr.cut;rerender(scr);return;}
  if(a==='ckp'){scr.prime=!scr.prime;rerender(scr);return;}
  if(a==='ckpay'){toast(scr,'Order placed. End of the prototype.',84);return;}
 }
 if(scr.type==='cart'){
  if(a==='sel'){var cc=cartOf(d.c).items[+d.i];cc.sel=!cc.sel;rerender(scr);return;}
  if(a==='cstep'){var c2=cartOf(d.c),i2=c2.items[+d.i],nd=+d.d;
   if(i2.q+nd<1)c2.items.splice(+d.i,1);else i2.q+=nd;rerender(scr);return;}
  if(a==='ctrash'){cartOf(d.c).items=[];rerender(scr);return;}
  if(a==='addmore'){push('store',{store:d.c});return;}
  if(a==='chk'){push('chk',{open:(function(){var o={},f=ordered().filter(function(c){return c.items.some(function(i){return i.sel;});})[0];if(f)o[f.s]=true;return o;})(),tip:5,del:'std',dopen:true,cut:false,prime:false});return;}
 }
});
document.getElementById('seg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 setV(b.getAttribute('data-v'));reset();});
document.getElementById('mseg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});
 S.mode=b.getAttribute('data-m');reset();});
document.getElementById('restart').addEventListener('click',reset);
document.getElementById('hot').addEventListener('change',function(){document.body.classList.toggle('hot',this.checked);});
reset();
})();
</script>
</body>
